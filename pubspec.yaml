name: soul_gate
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.1+12

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^8.2.1
  http: ^1.2.2
  flutter_screenutil: ^5.9.0
  image_picker: ^1.2.0
  intl: ^0.20.3
#  flutter_tts: ^3.8.5
  url_launcher: ^6.2.1
  webview_flutter: ^4.4.2
  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.23.5
  audioplayers: ^6.1.0
  path_provider: ^2.1.1
  share_plus: ^13.3.0

  file_saver: ^0.4.0



dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/blessing_en.mp3
    - assets/audio/blessing_es.mp3


